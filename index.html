
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deluxe Hot Desk Bookings</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #06121e;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */
header {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 15px;
  padding: 8px 20px;
  min-height: 90px;
  border-bottom: 1px solid #607080;
}

.branding {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.wordmark {
  width: 180px;
  max-width: 60%;
  height: auto;
  object-fit: contain;
}

.facilities-logo {
  width: 68px;
  height: 68px;
  object-fit: contain;
  border-radius: 50%;
}

h1 {
  font-size: clamp(19px, 2vw, 30px);
  margin: 0;
  text-align: center;
  white-space: nowrap;
}

.book-via {
  text-align: right;
  font-size: 17px;
}

/* MAIN DASHBOARD */
.main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 260px;
  gap: 10px;
  padding: 10px;
  align-items: start;
}

/* FLOOR PLAN */
.floor {
  position: relative;
  width: min(100%, calc((100vh - 125px) * 1200 / 1080));
  aspect-ratio: 1200 / 1080;
  margin: 0 auto;
  background: #26303b;
  border: 2px solid #8291a5;
  border-radius: 10px;
  overflow: hidden;
}

.floor img {
  width: 100%;
  height: 100%;
  display: block;
}

/* DESK MARKERS */
.desk {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 8%;
  height: 5%;
  border: 1px solid #555;
  border-radius: 4px;
  color: #111;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
}

.desk.booked { background: #ffb3b3; }
.desk.available { background: #baff9b; }
.desk.unknown { background: #b7c4d3; }

.desk strong {
  font-size: clamp(8px, 1.1vw, 18px);
  line-height: 1.1;
}

.desk span {
  font-size: clamp(6px, .8vw, 12px);
  font-weight: bold;
  white-space: nowrap;
  line-height: 1.1;
}

/* RIGHT INFORMATION PANEL */
aside {
  background: #091725;
  border: 1px solid #718096;
  border-radius: 10px;
  padding: 16px;
  text-align: center;
}

#date {
  font-size: 19px;
  font-weight: bold;
}

#clock {
  font-size: 48px;
  font-weight: bold;
  margin: 12px 0;
}

.legend {
  display: flex;
  flex-direction: column;
  gap: 12px;
  text-align: left;
  margin: 20px 0;
  padding: 18px 0;
  border-top: 1px solid #81909d;
  border-bottom: 1px solid #81909d;
}

.legend div {
  display: flex;
  align-items: center;
  gap: 12px;
}

.swatch {
  width: 30px;
  height: 26px;
  border-radius: 5px;
  flex-shrink: 0;
}

.green { background: #baff9b; }
.pink { background: #ffb3b3; }

aside h2 {
  font-size: 22px;
  margin: 18px 0;
}

.number {
  font-size: 48px;
  color: #91fa78;
  font-weight: bold;
}

#feedStatus {
  font-size: 13px;
  overflow-wrap: anywhere;
}

#lastUpdated {
  font-size: 12px;
  color: #b9c8d8;
}

/* BOTTOM STATISTICS */
.footer {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 0 10px 10px;
}

.stat {
  background: #091725;
  border: 1px solid #81909d;
  border-radius: 10px;
  text-align: center;
  padding: 8px;
  font-size: 17px;
}

.stat strong {
  display: block;
  font-size: 32px;
  margin-top: 5px;
}

#booked { color: #ff9999; }
#available { color: #91fa78; }

/* SMALLER SCREENS */
@media (max-width: 1000px) {
  header {
    grid-template-columns: 1fr auto;
  }

  h1 {
    grid-column: 1 / -1;
    grid-row: 2;
    padding-bottom: 8px;
  }

  .main {
    grid-template-columns: 1fr;
  }

  .floor {
    width: 100%;
  }
}

@media (max-width: 600px) {
  header { padding: 8px; }
  .wordmark { width: 130px; }

  .facilities-logo {
    width: 48px;
    height: 48px;
  }

  .book-via { font-size: 12px; }

  h1 {
    font-size: 19px;
    white-space: normal;
  }

  .desk strong { font-size: 9px; }
  .desk span { font-size: 6px; }
  .stat { font-size: 12px; }
  .stat strong { font-size: 24px; }
}

/* LANDSCAPE TV / RASPBERRY PI FIT */
@media (min-width: 900px) and (min-aspect-ratio: 4/3) and (min-height: 450px) {

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
  }

  header {
    grid-template-columns: 1fr auto 1fr;
    min-height: 0;
    padding: 6px 16px;
  }

  h1 {
    grid-column: auto;
    grid-row: auto;
    padding: 0;
    font-size: clamp(16px, 2vw, 36px);
  }

  .wordmark {
    width: clamp(90px, 12vw, 220px);
  }

  .facilities-logo {
    width: clamp(30px, 6vh, 68px);
    height: clamp(30px, 6vh, 68px);
  }

  .main {
    grid-template-columns: minmax(0, 1fr) clamp(190px, 22vw, 420px);
    min-height: 0;
    align-items: stretch;
    padding: 8px;
  }

  .main section {
    min-width: 0;
    min-height: 0;
    display: grid;
    place-items: center;
    container-type: size;
  }

  .floor {
    width: min(100cqw, calc(100cqh * 1200 / 1080));
    max-height: 100%;
    margin: 0;
  }

  aside {
    align-self: center;
    padding: clamp(8px, 1.5vh, 18px);
    max-height: 100%;
    overflow: auto;
  }

  #date {
    font-size: clamp(14px, 2.5vh, 30px);
  }

  #clock, .number {
    font-size: clamp(28px, 6vh, 70px);
    margin: 4px 0;
  }

  .legend {
    font-size: clamp(13px, 2.3vh, 26px);
    gap: 6px;
    margin: 8px 0;
    padding: 8px 0;
  }

  .swatch {
    width: clamp(16px, 3vh, 32px);
    height: clamp(14px, 2.5vh, 28px);
  }

  aside h2 {
    font-size: clamp(15px, 2.8vh, 32px);
    margin: 8px 0;
  }

  aside p {
    margin: 5px 0;
    font-size: clamp(12px, 2vh, 22px);
  }

  #feedStatus, #lastUpdated {
    font-size: clamp(10px, 1.6vh, 18px);
  }

  .footer {
    padding: 0 8px 8px;
    gap: 8px;
  }

  .stat {
    padding: 4px;
    font-size: clamp(12px, 2vh, 24px);
  }

  .stat strong {
    font-size: clamp(20px, 3.5vh, 40px);
    margin-top: 2px;
  }

  .desk strong {
    font-size: clamp(7px, 1.5cqh, 18px);
  }

  .desk span {
    font-size: clamp(5px, 1.1cqh, 12px);
  }
}

</style>
</head>

<body>

<header>
  <div class="branding">
    <img class="wordmark"
         src="deluxe-wordmark.png"
         alt="Deluxe">

    <img class="facilities-logo"
         src="deluxe-facilities-logo.png"
         alt="Deluxe Facilities">
  </div>

  <h1>Hot Desk Bookings – 1st Floor – 98 Theobalds Road</h1>

  <div class="book-via">
    Book via Envoy
  </div>
</header>

<div class="main">

  <section>
    <div class="floor" id="floor">
      <img src="floorplan.png"
           alt="First floor 3D floor plan">
    </div>
  </section>

  <aside>
    <div id="date"></div>
    <div id="clock"></div>

    <div class="legend">
      <div>
        <span class="swatch green"></span>
        Available
      </div>

      <div>
        <span class="swatch pink"></span>
        Booked
      </div>
    </div>

    <h2>Desks Available</h2>

    <div class="number">
      <span id="availableSide">—</span> / 28
    </div>

    <p>Book a Desk via Envoy</p>

    <p id="feedStatus">
      Loading today's Envoy bookings...
    </p>

    <p id="lastUpdated"></p>
  </aside>

</div>

<div class="footer">
  <div class="stat">
    Booked Desks
    <strong id="booked">—</strong>
  </div>

  <div class="stat">
    Available Desks
    <strong id="available">—</strong>
  </div>

  <div class="stat">
    Total Desks
    <strong>28</strong>
  </div>
</div>

<script>

/* EXISTING DESK POSITIONS */
const positions = {
  16:[16.5,33],
  15:[24.5,33],
  12:[16.5,38],
  11:[24.5,38],

  14:[38.5,33],
  13:[46.5,33],
  10:[38.5,38],
  9:[46.5,38],

  8:[16.5,57],
  7:[24.5,57],
  4:[16.5,62],
  3:[24.5,62],

  6:[38.5,57],
  5:[46.5,57],
  2:[38.5,62],
  1:[46.5,62],

  28:[72,36],
  25:[81,36],
  26:[90,36],
  27:[72,41],
  23:[81,41],
  24:[90,41],

  20:[72,59],
  21:[81,59],
  22:[90,59],
  17:[72,64],
  18:[81,64],
  19:[90,64]
};

/*
  DAILY ENVOY BOOKING SNAPSHOT

  GitHub Actions generates bookings.json.

  The dashboard uses today's saved bookings.
  No employee names or API credentials
  are displayed or stored in this HTML.
*/

let bookings = {};
let feedReady = false;

/* GET TODAY'S LONDON DATE */
function londonDate() {

  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/London",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const part = name =>
    parts.find(p => p.type === name).value;

  return part("year") + "-" +
         part("month") + "-" +
         part("day");
}

/* READ SAVED DAILY BOOKINGS */
async function refreshBookings() {

  const status =
    document.getElementById("feedStatus");

  try {

    const response = await fetch(
      "bookings.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const payload = await response.json();

    if (
      !payload ||
      payload.ok !== true ||
      !payload.generatedAt ||
      !payload.date ||
      !payload.bookings ||
      typeof payload.bookings !== "object" ||
      Array.isArray(payload.bookings)
    ) {
      throw new Error("Invalid booking data");
    }

    /* Only accept bookings for today */
    const today = londonDate();

    if (payload.date !== today) {
      throw new Error(
        "Waiting for today's bookings"
      );
    }

    /*
      Today's saved bookings remain valid
      throughout the current day.
    */

    const generated =
      Date.parse(payload.generatedAt);

    if (
      !Number.isFinite(generated) ||
      generated > Date.now() + 120000
    ) {
      throw new Error(
        "Invalid booking generation time"
      );
    }

    const cleanBookings = {};

    for (const id of Object.keys(positions)) {
      cleanBookings[id] =
        payload.bookings[id] === "Booked";
    }

    bookings = cleanBookings;
    feedReady = true;

    status.textContent =
      "TODAY'S ENVOY BOOKINGS";

    status.style.color = "#91fa78";

    document.getElementById(
      "lastUpdated"
    ).textContent =
      "Bookings saved at: " +
      new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/London",
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(generated));

  } catch (err) {

    feedReady = false;
    bookings = {};

    status.textContent =
      "BOOKING DATA UNAVAILABLE — " +
      err.message;

    status.style.color = "#ffc56a";

    document.getElementById(
      "lastUpdated"
    ).textContent =
      "Desk availability cannot be confirmed";
  }

  render();
}

/* DRAW DESKS */
function render() {

  const floor =
    document.getElementById("floor");

  floor.querySelectorAll(".desk").forEach(
    element => element.remove()
  );

  let booked = 0;

  Object.entries(positions).forEach(
    ([id, pos]) => {

      const isBooked =
        feedReady && bookings[id] === true;

      if (isBooked) booked++;

      const el =
        document.createElement("div");

      el.className =
        "desk " +
        (!feedReady
          ? "unknown"
          : isBooked
            ? "booked"
            : "available");

      el.style.left = pos[0] + "%";
      el.style.top = pos[1] + "%";

      const number =
        document.createElement("strong");

      number.textContent = id;

      const label =
        document.createElement("span");

      label.textContent =
        !feedReady
          ? "Unknown"
          : isBooked
            ? "Booked"
            : "Available";

      el.append(number, label);
      floor.appendChild(el);
    }
  );

  const total =
    Object.keys(positions).length;

  const available = total - booked;

  document.getElementById(
    "booked"
  ).textContent =
    feedReady ? booked : "—";

  document.getElementById(
    "available"
  ).textContent =
    feedReady ? available : "—";

  document.getElementById(
    "availableSide"
  ).textContent =
    feedReady ? available : "—";
}

/* LONDON DATE AND CLOCK */
function updateClock() {

  const now = new Date();

  document.getElementById(
    "date"
  ).textContent =
    new Intl.DateTimeFormat("en-GB", {
      weekday: "long",
      day: "numeric",
      month: "long",
      timeZone: "Europe/London"
    }).format(now);

  document.getElementById(
    "clock"
  ).textContent =
    new Intl.DateTimeFormat("en-GB", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false,
      timeZone: "Europe/London"
    }).format(now);
}

/* INITIAL DASHBOARD LOAD */
render();
updateClock();
refreshBookings();

/*
  DAILY SNAPSHOT CHECK

  The page reads the saved JSON on opening.

  If left open overnight, it checks for
  the new day and again after 7:10 AM.

  This does not call Envoy's API.
*/

let lastCalendarDate = londonDate();
let lastMorningCheck = "";

setInterval(() => {

  const today = londonDate();

  const timeParts =
    new Intl.DateTimeFormat("en-GB", {
      timeZone: "Europe/London",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }).formatToParts(new Date());

  const part = name =>
    timeParts.find(p => p.type === name).value;

  const minutes =
    Number(part("hour")) * 60 +
    Number(part("minute"));

  /* New calendar day */
  if (today !== lastCalendarDate) {
    lastCalendarDate = today;
    refreshBookings();
  }

  /* Check today's saved file after 07:10 */
  if (
    minutes >= 430 &&
    lastMorningCheck !== today
  ) {
    lastMorningCheck = today;
    refreshBookings();
  }

}, 60000);

/* KEEP CLOCK RUNNING */
setInterval(updateClock, 1000);

</script>

</body>
</html>
